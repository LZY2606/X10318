plugins {
    id 'java'
    id 'application'
}

group = 'org.fealedger'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
}

application {
    mainClass = 'org.fealedger.Main'
}

processResources {
    from(rootDir.toPath().resolve('case-pack')) {
        into 'case-pack'
    }
}

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}
