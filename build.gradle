plugins {
    id 'java'
    id 'application'
}

group = 'femledger'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'femledger.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// Regenerates the checked-in offline case pack fixture (tests still only read fixtures).
tasks.register('generateCasepack', JavaExec) {
    group = 'femledger'
    description = 'Writes the offline FEM case pack fixture under fixtures/casepack'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'femledger.casepack.CasePackGenerator'
    args = [file('fixtures/casepack').absolutePath]
}
